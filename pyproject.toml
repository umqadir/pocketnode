[project]
name = "pocketnode"
version = "0.1.0"
description = "Use an iPhone as a compute node for your Mac: ordinary Python, placed automatically"
readme = "README.md"
authors = [
    { name = "Uzair Qadir", email = "umqadir@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cloudpickle>=3.1.2",
]

[project.optional-dependencies]
all = [
    "dask[array,dataframe]",
    "ipython",
    "joblib",
    "numpy",
    "pandas",
    "scikit-learn",
]
provision = [
    "packaging",
    "pyyaml",
]

[project.scripts]
pocketnode = "pocketnode.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

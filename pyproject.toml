[project]
name = "pocketnode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Uzair Qadir", email = "umqadir@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cloudpickle>=3.1.2",
]

[project.optional-dependencies]
all = [
    "dask>=2026.8.0",
    "ipython>=9.18.1",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project]
name = "pocketnode"
version = "0.1.0"
description = "Use an iPhone as a compute node for your Mac: ordinary Python, placed automatically"
readme = "README.md"
authors = [
    { name = "Uzair Qadir", email = "umqadir@users.noreply.github.com" }
]
# The phone runs CPython 3.13 (BeeWare's Python-Apple-support), and the Mac's
# Python must be the same minor version: bytecode and extensions are shared.
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "cloudpickle>=3.1.2",
    # Building the app and adding packages: requirement parsing, and the iOS SDK's .tbd stubs (YAML).
    "packaging>=24",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/umqadir/pocketnode"

[project.optional-dependencies]
# What the integrations plug into: `pn.parallel()` (joblib), the pandas
# accessor, `dask.compute(..., scheduler=ex)` and the Jupyter magics.
integrations = [
    "dask[array,dataframe]",
    "ipython",
    "joblib",
    "pandas",
]
# A scientific stack to put on the phone (the phone runs the Mac's own copies).
science = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
]
all = [
    "pocketnode[integrations,science]",
]

[project.scripts]
pocketnode = "pocketnode.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pocketnode[all]",  # the tests exercise every integration
    "pexpect>=4.9.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
